# /etc/nginx/sites-available/multi-saas   (symlink into sites-enabled)
#
# nginx serves the static dashboards + product-image media straight from disk
# and reverse-proxies only the API to uvicorn (bound to 127.0.0.1:8000).
#
# Replace  app.example.com  with your real domain, then run certbot (see
# server-setup.md) which will rewrite this file to add the HTTPS server block
# and the port-80 -> 443 redirect.

server {
    listen 80;
    server_name app.example.com;

    # Static dashboards (platform/ + tenant/ + shared/)
    root /var/www/multi-saas/apps/web_fastfood;
    index index.html;

    client_max_body_size 6m;          # product-image uploads are capped at 5 MB

    # ── API → uvicorn ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Uploaded product images → uvicorn (FastAPI StaticFiles mount) ──
    # The backend writes these to apps/backend_fastfood/media/ at runtime.
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API docs — comment this block out in production if you don't want them public ──
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ── Static pages ────────────────────────────────────────────
    location /shared/ { try_files $uri =404; expires 1h; }

    # Tenant pages and scripts must update together when API routes change.
    location /tenant/ {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-store" always;
    }

    # There is no landing page at "/" — send it to the platform login.
    location = / { return 302 /platform/login.html; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # health check for uptime monitors
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}
