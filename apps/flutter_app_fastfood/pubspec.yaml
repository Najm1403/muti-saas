name: fastfood_pos
description: Storixx POS — offline-first tablet app for branch cashiers.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # Network
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local DB
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Preferences
  shared_preferences: ^2.3.1

  # Serialization
  json_annotation: ^4.9.0

  # PDF / printing
  pdf: ^3.11.0
  printing: ^5.13.2
  print_bluetooth_thermal: ^1.2.4
  esc_pos_utils_plus: ^2.0.4
  image: ^4.2.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  decimal: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.11
  drift_dev: ^2.19.1
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/smartshop.png
