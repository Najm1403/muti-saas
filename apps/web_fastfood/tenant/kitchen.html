<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Display</title><script src="../shared/safe-text.js"></script>
<style>body{font:16px system-ui;margin:24px;background:#f1f5f9;color:#0f172a}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}#queue{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}article{background:white;border-radius:12px;padding:20px}button,select{padding:12px;border:1px solid #cbd5e1;border-radius:8px}button{cursor:pointer;background:#4f46e5;color:white}#error{color:#b91c1c}</style></head>
<body><header><a href="preparation-stations.html">Station setup</a><h1>Kitchen Display</h1><select id="branch" aria-label="Branch"></select><select id="station" aria-label="Station"><option value="">All stations</option></select><button id="refresh">Refresh</button></header><p id="error" role="alert"></p><main id="queue"></main>
<script>
const token=localStorage.getItem('tenant_token');
async function api(path,options={}){const r=await fetch('/api/v1'+path,{...options,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}});if(!r.ok){const e=await r.json();throw Error(e.detail||e.message||'Request failed');}return r.json();}
const branch=document.getElementById('branch'),station=document.getElementById('station'),queue=document.getElementById('queue'),error=document.getElementById('error');
const next={PENDING:'PREPARING',PREPARING:'READY',READY:'SERVED'};
async function load(){if(!branch.value)return;try{const rows=await api('/branches/'+branch.value+'/preparation-stations/queue');queue.replaceChildren();for(const row of rows){if(station.value&&row.station_id!==station.value)continue;const card=document.createElement('article');const title=document.createElement('h2');title.textContent=row.quantity+' ? '+row.product_name;const details=document.createElement('p');details.textContent=row.sale_number+' ? '+row.options.join(', ');const status=document.createElement('p');status.textContent=row.status;const button=document.createElement('button');button.textContent='Mark '+next[row.status].toLowerCase();button.onclick=async()=>{button.disabled=true;try{await api('/branches/'+branch.value+'/preparation-stations/queue/'+row.id,{method:'PATCH',body:JSON.stringify({status:next[row.status]})});await load();}catch(e){error.textContent=e.message;button.disabled=false;}};card.append(title,details,status,button);queue.append(card);}if(!queue.children.length)queue.textContent='No pending kitchen orders.';error.textContent='';}catch(e){error.textContent=e.message;}}
async function selectBranch(){station.replaceChildren(new Option('All stations',''));if(!branch.value){queue.textContent='No branches available.';error.textContent='';return;}try{const rows=await api('/branches/'+branch.value+'/preparation-stations/');for(const row of rows)station.add(new Option(row.name,row.id));await load();}catch(e){error.textContent=e.message;}}
branch.onchange=selectBranch;station.onchange=load;document.getElementById('refresh').onclick=load;
(async()=>{try{for(const b of await api('/branches/stats'))branch.add(new Option(b.name,b.id));await selectBranch();}catch(e){error.textContent=e.message;}})();setInterval(load,10000);
</script><script src="/shared/responsive.js" defer></script></body></html>
